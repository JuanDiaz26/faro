# Configuración Fly.io para Faro.
# Cambiá el `app` por el nombre que elijas en `fly apps create`
# (si "faro" está tomado: faro-tunombre, mi-faro, etc.).
# Región eze = Ezeiza (Buenos Aires) → latencia baja para AR.

app = "mi-faro"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/finanzas.db"
  NODE_ENV = "production"

# Volumen persistente para la SQLite — sobrevive a redeploys y restarts.
[[mounts]]
  source = "faro_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Apaga la máquina si está idle (ahorra recursos del free tier).
  # Arranca de nuevo en ~1-2s cuando abrís la app.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

# 1 máquina shared-cpu-1x con 256mb — sobrado para single-user.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
